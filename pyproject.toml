[project]
name = "caelum"
version = "0.5.10"
description = "Headless allsky / astro camera engine for Raspberry Pi: sky-aware auto-exposure, RAM-first image pipeline, keograms, meteor detection, timelapses, web UI and remote archive upload"
readme = "README.md"
keywords = [
    "allsky",
    "all-sky camera",
    "astronomy",
    "astrophotography",
    "raspberry-pi",
    "picamera2",
    "libcamera",
    "meteor-detection",
    "keogram",
    "timelapse",
    "sky-quality",
    "weather-monitoring",
    "observatory",
    "fastapi",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: No Input/Output (Daemon)",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Capture :: Digital Camera",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Image Processing",
]
authors = [
    { name = "Roman Dvorak", email = "romandvorak@mlab.cz" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "redis>=5.2",
    # 1.24 is Raspberry Pi OS Bookworm's system numpy, which apt's picamera2
    # is compiled against — see scripts/constraints-rpi.txt.
    "numpy>=1.24",
    "opencv-python-headless>=4.10",
    "astropy>=6.1",
    "python-dotenv>=1.0",
    "psutil>=6.1",
    "python-multipart>=0.0.12",
    "Pillow>=10.0",
    "packaging>=23.0",
    "boto3>=1.35",
    "rawpy>=0.21",
]

[project.urls]
Homepage = "https://github.com/roman-dvorak/caelum"
Source = "https://github.com/roman-dvorak/caelum"
Issues = "https://github.com/roman-dvorak/caelum/issues"

[project.optional-dependencies]
picamera2 = [
    "picamera2>=0.3.20; platform_machine=='aarch64' or platform_machine=='armv7l'",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "httpx>=0.27",
]

[project.scripts]
caelum = "caelum.main:run"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()-in-default-argument is the documented, idiomatic
# way to declare dependencies — not the mutable-default-argument bug B008
# otherwise catches.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
