[project]
name = "caelum"
version = "0.1.0"
description = "Headless allsky/astro camera capture engine: exposure control, sky-state, RAM-first image pipeline"
readme = "README.md"
authors = [
    { name = "Roman Dvorak", email = "romandvorak@mlab.cz" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "redis>=5.2",
    "numpy>=2.1",
    "opencv-python-headless>=4.10",
    "astropy>=6.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
picamera2 = [
    "picamera2>=0.3.20; platform_machine=='aarch64' or platform_machine=='armv7l'",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "httpx>=0.27",
]

[project.scripts]
caelum = "caelum.main:run"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()-in-default-argument is the documented, idiomatic
# way to declare dependencies — not the mutable-default-argument bug B008
# otherwise catches.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
