# Push a tag matching pyproject's version to publish a release:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The release's assets are what cameras update from: the default
# update.manifest_url is .../releases/latest/download/manifest.json.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
          # Where the web package below is published; reads NODE_AUTH_TOKEN.
          registry-url: https://npm.pkg.github.com
          scope: "@roman-dvorak"

      - name: Tag matches the package version
        run: |
          version="$(uv version --short)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject version $version" >&2
            exit 1
          fi

      # tests/conftest.py starts a throwaway redis-server per test.
      - run: sudo apt-get install -y -qq redis-server
      - run: uv sync --group dev
      - run: uv run pytest -q

      - name: Build
        run: |
          # checkout fetches the commit, not the annotated tag object that
          # holds the release notes shown in the camera's update dialog.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          scripts/build-release.sh --notes "$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"

      # The sky drawing code as an npm package on GitHub Packages, for other
      # web apps (the Caelum Viewer) — same version as the release. Skipped if
      # this version is already there, so a re-run of the workflow is safe.
      - name: Publish the web sky package
        working-directory: web/packages/sky
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="$(node -p "require('./package.json').name")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published"
            exit 0
          fi
          npm pkg set version="$version"
          pnpm test
          pnpm build
          pnpm publish --no-git-checks

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "caelum $GITHUB_REF_NAME" --generate-notes
