# Builds the VitePress site (pages in docs/, tooling in web/apps/docs) and
# publishes it to GitHub Pages at https://caelum.astrometers.eu — the
# `DOCS_URL` (web/packages/ui/src/brand.ts) the web UI deep-links into. The domain comes from
# docs/public/CNAME, so the site is served at the root and DOCS_BASE stays "/".
#
# One-time repo setup: Settings → Pages → Source: "GitHub Actions".
name: Docs

on:
  push:
    branches: [master]
    paths:
      - docs/**
      - web/apps/docs/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # lastUpdated reads each page's git history
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --filter docs
      - run: pnpm --filter docs build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/apps/docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Tells Bing (and the other IndexNow engines) that the pages changed, rather
  # than waiting for the next crawl. The key is public by design: it is served
  # as docs/public/<key>.txt, which is how the engines check we own the host.
  # The site is small, so every URL in the sitemap goes in each time.
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      SITE: https://caelum.astrometers.eu
      KEY: 3e9ebe167417822040d108364c18d180
    steps:
      - run: |
          curl -fsS "$SITE/sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' \
            | jq -R . | jq -s --arg key "$KEY" --arg host "${SITE#https://}" --arg site "$SITE" \
                '{host: $host, key: $key, keyLocation: "\($site)/\($key).txt", urlList: .}' \
            > body.json
          jq '.urlList | length' body.json
          curl -fsS -w '%{http_code}\n' -o /dev/null -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' --data @body.json
