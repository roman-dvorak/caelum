<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>caelum</title>
    <script>
      // Applies the stored theme before first paint. Without this the page
      // renders in the default palette and visibly flips once React mounts.
      // Must stay in sync with ThemeProvider in packages/ui/src/theme.tsx.
      (function () {
        try {
          var stored = localStorage.getItem('caelum:theme')
          var resolved =
            stored === 'light' || stored === 'dark'
              ? stored
              : stored === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.dataset.theme = resolved
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
